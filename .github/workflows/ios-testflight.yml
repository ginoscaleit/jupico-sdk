name: iOS TestFlight

# Manual trigger only - uploading to TestFlight should be deliberate.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion (defaults to the workflow run number)"
        required: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SCHEME: WalletExample
      # The React Native SDK lives in jupico-react-native/; the root example/ is
      # the earlier research build and is no longer shipped.
      APP_DIR: jupico-react-native/example
      WORKSPACE: jupico-react-native/example/ios/WalletExample.xcworkspace

    steps:
      - uses: actions/checkout@v4

      # Apple requires the iOS 26 SDK for all App Store Connect uploads.
      # Runner images change, so pick the newest Xcode present and fail fast
      # if it is too old, rather than 40 minutes later at the upload step.
      - name: Select Xcode with the iOS 26+ SDK
        run: |
          set -euo pipefail
          newest=""; newest_app=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v=$(/usr/bin/defaults read "$app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo 0)
            echo "found $app -> $v"
            if [ -z "$newest" ] || [ "$(printf '%s\n%s\n' "$v" "$newest" | sort -V | tail -1)" = "$v" ]; then
              newest="$v"; newest_app="$app"
            fi
          done
          [ -n "$newest_app" ] || { echo "::error::No Xcode found on runner"; exit 1; }
          sudo xcode-select -s "$newest_app/Contents/Developer"
          xcodebuild -version
          sdk=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9.]*\).*/\1/p' | sort -V | tail -1)
          echo "newest iOS SDK: $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::Runner's newest iOS SDK is $sdk; App Store Connect requires 26+. Try runs-on: macos-26."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # SDK install first: the example depends on it via "file:..", and its
      # 'prepare' script (bob build) must run so lib/ exists.
      - name: Install SDK dependencies
        working-directory: jupico-react-native
        run: npm ci

      - name: Install example dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Install CocoaPods
        working-directory: ${{ env.APP_DIR }}/ios
        run: pod install --repo-update

      # TestFlight rejects duplicate build numbers, so always use a fresh one.
      # Marketing version (1.0) is left alone.
      - name: Set build number
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          BUILD_NO="${{ github.event.inputs.build_number || github.run_number }}"
          echo "Using build number $BUILD_NO"
          /usr/bin/xcrun agvtool new-version -all "$BUILD_NO"

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "--- identities ---"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Manual signing: the project pins this profile by name for Release.
      # altool resolves the key by ID from ~/.appstoreconnect/private_keys.
      - name: Install App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_BASE64" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "installed AuthKey_${ASC_KEY_ID}.p8"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$DIR/build.mobileprovision"
          security cms -D -i "$DIR/build.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          echo "installed: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          echo "expires:   $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/WalletExample.xcarchive"

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WalletExample.xcarchive" \
            -exportOptionsPlist "$APP_DIR/ios/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          echo "--- signature check ---"
          codesign -dvvv "$RUNNER_TEMP/export/../WalletExample.xcarchive/Products/Applications/WalletExample.app" 2>&1 | grep Authority= || true
          ls -lh "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WalletExample-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore

      - name: Clean up secrets
        if: always()
        run: |
          security delete-keychain "${KEYCHAIN:-}" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"
          rm -rf "$HOME/.appstoreconnect/private_keys"
